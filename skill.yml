metadata:
  organization: QuantSkills
  organization_url: https://github.com/quantskills
  repository: skill-simons-pairs-trading
  repository_url: https://github.com/quantskills/skill-simons-pairs-trading
  project_type: skill
  collection: statistical-arbitrage
  license: MIT
  category: trader-research
  tags:
    - pairs-trading
    - cointegration
    - mean-reversion
    - statistical-arbitrage
    - panda-data
  platforms:
    - codex
  language: zh-en
  status: beta
  validation_level: conditional
  maintainer_type: community
  # Sibling QUANTSKILLS repositories only; Python packages are listed below.
  requires: []
  external_requirements:
    runtime:
      - name: Python
        version: ">=3.11,<3.13"
      - name: panda_data
        version: "0.0.12"
        distribution: installed by the user from the hash-locked requirements
        license_and_maintainer: not publicly verified; user review required
    data_access:
      - valid PandaData entitlement and permission to use requested datasets
      - provider-supplied PandaData HTTPS endpoint; provider default HTTP is rejected
    authentication:
      - short-lived PANDADATA_TOKEN, or account and password for token exchange
  permissions:
    network:
      - outbound HTTPS to the provider-supplied PANDADATA_BASE_URL
    credentials:
      - read PandaData values from the process environment or user-level ~/.pandadata.env
      - keep the SDK session in process memory; no SDK user.json persistence or reload
    filesystem:
      - read the user-level PandaData environment file when present
      - write cache files under ~/.newmax/simons_cache unless SIMONS_CACHE overrides it
      - write research artifacts under ./outputs/simons_pairs unless SIMONS_OUT overrides it
  validated_environment:
    - Windows
    - PowerShell
    - Python 3.11
    - Python 3.12
  summary_zh: 基于复权行情、同行业协整、FDR 与滚动门控的 A 股配对交易研究。
  summary_en: Conditional A-share pairs research with adjusted prices, cointegration, FDR, rolling backtests, and conservative gates.
