name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-lock.txt
      - name: Run synthetic and contract tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONUTF8: "1"
        run: python -m pytest -q -p no:cacheprovider
      - name: Compile Python sources
        run: python -m compileall -q scripts tests references
      - name: Validate Skill frontmatter
        shell: python
        run: |
          from pathlib import Path
          import re
          text = Path("SKILL.md").read_text(encoding="utf-8")
          match = re.match(r"^---\n(.*?)\n---\n", text, re.S)
          assert match, "SKILL.md frontmatter is missing"
          assert re.search(r"^name:\s*simons-pairs-trading\s*$", match.group(1), re.M)
          assert re.search(r"^description:\s*.+$", match.group(1), re.M)
