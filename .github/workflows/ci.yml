name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-lock.txt
      - name: Run synthetic and contract tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONUTF8: "1"
        run: python -m pytest -q -p no:cacheprovider
      - name: Lint Python sources
        run: python -m ruff check scripts tests
      - name: Compile Python sources
        run: python -m compileall -q scripts tests references
      - name: Validate Skill frontmatter
        shell: python
        run: |
          from pathlib import Path
          import re
          text = Path("SKILL.md").read_text(encoding="utf-8")
          match = re.match(r"^---\n(.*?)\n---\n", text, re.S)
          assert match, "SKILL.md frontmatter is missing"
          assert re.search(r"^name:\s*simons-pairs-trading\s*$", match.group(1), re.M)
          assert re.search(r"^description:\s*.+$", match.group(1), re.M)
